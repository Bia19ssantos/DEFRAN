                    <div class="container-fluid px-1 py-5 mx-auto">

                        </div>
                        <div style="margin-top: 20px;"></div>
                        <div class="row d-flex justify-content-center">
                            <div class="col-xl-7 col-lg-8 col-md-9 col-11 text-center">
                                <form class="form-card" id="formCliente" method="POST" action="SalvarClienteServlet">
                                    <div class="row justify-content-between text-left">
                                        <div class="form-group col-sm-4 flex-column d-flex">
                                            <label class="form-control-label px-4">CNPJ<span id="cnpj-validation-message" class="text-danger"></span></label>
                                            <div class="d-flex align-items-center">
                                                <input class="input-cnpj form-control mr-lg-2" type="text" id="cnpj" name="cnpj" placeholder="___._____._____/______-___">
                                                <button class="btn btn-primary" id="buscaCnpj" type="button" title="buscaCnpj"><i class="fas fa-search"></i></button>
                                            </div>
                                        </div>
                                        <div class="form-group col-sm-8 flex-column d-flex"> <label class="form-control-label px-3">RAZÃO SOCIAL<span class="text-danger"> *</span></label>
                                            <input type="text" id="razao" name="razao" placeholder="Digite a Razão Social"> 
                                        </div>
                                    </div>
                                    <div class="row justify-content-between text-left">
                                        <div class="form-group col-sm-4 flex-column d-flex"> <label class="form-control-label px-3">CONTATO<span class="text-danger"> *</span></label> 
                                            <input type="text" id="contato" name="contato" placeholder="Digite o nome do contato"> 
                                        </div>
                                        <div class="form-group col-sm-4 flex-column d-flex"><label class="form-control-label px-3">TELEFONE<span id="telefone-validation-message" class="text-danger"></span></label> 
                                            <input class="input-telefone" type="text" id="telefone" name="telefone" placeholder="(___)______-______"> 
                                        </div>
                                        <div class="form-group col-sm-4 flex-column d-flex">

                                            <input class="input-phone" type="text" id="celular" name="celular" placeholder="(___)_______-_____"" maxlength="15">
                                            <span id="celular-validation-message" class="text-danger"></span>
                                        </div>
                                    </div>
                                    <div class="row justify-content-between text-left">
                                        <div class="form-group col-sm-8 flex-column d-flex"><label class="form-control-label px-3">EMAIL<span class="text-danger"> *</span></label> 
                                            <input type="text" id="email" name="email" placeholder="nome@exemplo.com.br"> 
                                        </div>
                                        <div class="form-group col-sm-4 flex-column d-flex">
                                            <label class="form-control-label px-3">CEP<span class="text-danger"> *</span></label>
                                            <div class="d-flex align-items-center">
                                                <input class="input-cep form-control mr-lg-2" type="text" id="cep" name="cep" placeholder="__________-______" maxlength="9">

                                            </div>
                                            <span id="cep-validation-message" class="text-danger"></span>
                                        </div>

                                    <div class="row justify-content-between text-left">

                                        <div class="form-group col-sm-5 flex-column d-flex"><label class="form-control-label px-3">bairro<span class="text-danger"> *</span></label>

                    <!-- Modal de Sucesso no Cadastro -->
                    <div class="modal fade" id="modalSucesso" tabindex="-1" role="dialog" aria-labelledby="modalSucessoLabel" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered" style="max-width: 700px; max-height: 300px;">
                            <div class="modal-content modalC">
                                <div class="modal-body">
                                    <div class="d-flex align-items-center"> <!-- Utiliza Flexbox para alinhar itens verticalmente -->
                                        <img src="assets/icons/cadastro.gif" alt="cadastro" class="imagem-modal mr-3" style="width: 60px; height: 60px;"> <!-- Adiciona margem à direita (mr) para espaçamento -->

                                            <p><strong> Os dados foram salvos com sucesso.</strong></p>
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btnOK1" id="btnOK1" data-dismiss="modal">Novo Cliente</button>
                                </div>
                            </div>
                        </div>

                </main>
                <div id="rodape"></div>
            </div>

        <script>
            // Use fetch para carregar o conteúdo do header.html na div com id 'header'
            fetch('rodape.html')
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById('rodape').innerHTML = data;
                    });

            // Use fetch para carregar o conteúdo do header.html na div com id 'header'
            fetch('header.html')
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById('header').innerHTML = data;
                    });

            // Quando o documento estiver pronto
            $(document).ready(function () {
                // Ao clicar em btnSave
                $("#btnConsultaOrc").click(function () {
                    // Redireciona para a página orcamentos.html
                    window.location.href = "clientes.html";
                });
            });

            async function consultarCnpj() {
                const cnpjOk = document.getElementById('cnpj').value;
                const cnpj = limparCNPJ(cnpjOk);

                const apiUrl = `https://publica.cnpj.ws/cnpj/${cnpj}`;

                try {
                    const response = await fetch(apiUrl);

                    if (response.ok) {
                        const data = await response.json();
                        preencherCamposFormulario(data);
                    } else {
                        console.error(`Erro na solicitação: ${response.status}`);
                        const errorData = await response.text();
                        console.error(errorData);
                    }
                } catch (error) {
                    console.error('Erro na solicitação:', error);
                }
            }

            function preencherCamposFormulario(data) {
                // Preencha os campos do formulário com os dados retornados da API
                document.getElementById('razao').value = data.razao_social || '';
                document.getElementById('telefone').value = data.estabelecimento.ddd1 + data.estabelecimento.telefone1 || '';
                document.getElementById('celular').value = data.estabelecimento.ddd2 + data.estabelecimento.telefone2 || '';
                document.getElementById('cep').value = data.estabelecimento.cep || '';
                document.getElementById('cidade').value = data.estabelecimento.cidade.nome || '';
                document.getElementById('estado').value = data.estabelecimento.estado.sigla || '';
                document.getElementById('bairro').value = data.estabelecimento.bairro || '';
                document.getElementById('endereco').value = `${data.estabelecimento.tipo_logradouro} ${data.estabelecimento.logradouro}` || '';
                document.getElementById('numero').value = data.estabelecimento.numero || '';
                document.getElementById('complemento').value = data.estabelecimento.complemento || '';
            }

            $("#buscaCnpj").click(function () {
                consultarCnpj();
            });

            function limparCNPJ(cnpj) {
                // Remove caracteres especiais (tudo que não é número)
                return cnpj.replace(/[^\d]/g, '');
            }
            
            // Obtém uma referência para o botão btnOK
                var btnOK = document.getElementById("btnOK1");

                // Adiciona um ouvinte de clique ao botão
                btnOK.addEventListener("click", function () {
                    // Redireciona para a página "index.html"
                    window.location.href = "cadastro_clientes.html";
                });


        </script>
